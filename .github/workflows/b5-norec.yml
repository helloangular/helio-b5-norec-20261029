# B5 gate lane (qa227, 29 Oct 2026): provider-managed release workflow for worker B3's VPS controller cases
# (TC-36..40, 173, 179, 182, 188). Helio dispatches one run; the test job waits at b5-norec-test, then the
# production job waits at b5-norec-production (required reviewer: helio-release-reviewer). Adapted from the
# owner's qualified owner-227-provider.yml. Repository variables (no new commit needed):
# B5_NOREC_TEST_SLEEP (seconds, default 40), B5_NOREC_TEST_MODE (fail | timeout); a release version containing
# "lockfail" makes the test job fail (failure-locked console fixture). Nothing is deployed;
# production records one synthetic GitHub deployment as evidence.
name: b5-norec
run-name: ${{ inputs.helio_execution_id }}

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: false
        default: b5-norec-test
        options: [b5-norec-test, b5-norec-production]
      helio_execution_id:
        type: string
        required: false
        default: ''
      helio_release_id:
        type: string
        required: false
        default: ''
      helio_stage_id:
        type: string
        required: false
        default: ''
      workflow_revision:
        type: string
        required: false
        default: ''
      release_version:
        type: string
        required: false
        default: ''

permissions:
  contents: read
  deployments: write

concurrency:
  group: b5-norec-${{ inputs.helio_execution_id || github.run_id }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ vars.B5_NOREC_TEST_MODE == 'timeout' && 1 || 10 }}
    environment: b5-norec-test
    steps:
      - name: Synthetic test work
        shell: bash
        env:
          MODE: ${{ vars.B5_NOREC_TEST_MODE }}
          SLEEP_SECONDS: ${{ vars.B5_NOREC_TEST_SLEEP || '40' }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "timeout" ]; then sleep 150; fi
          sleep "$SLEEP_SECONDS"
          if [ "$MODE" = "fail" ]; then echo "B5_NOREC_TEST_MODE=fail: synthetic test failure"; exit 1; fi
          # Failure-locked fixture (QA console recipe): only a release whose version contains "lockfail" fails here.
          case "$RELEASE_VERSION" in *lockfail*) echo "release version $RELEASE_VERSION requests a synthetic test failure"; exit 1;; esac
          echo "synthetic tests passed"

  production:
    needs: test
    if: ${{ vars.B5_NOREC_SKIP_PRODUCTION != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: b5-norec-production
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Record synthetic deployment evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT: b5-norec-production
          HELIO_EXECUTION_ID: ${{ inputs.helio_execution_id }}
          HELIO_RELEASE_ID: ${{ inputs.helio_release_id }}
          WORKFLOW_REVISION: ${{ inputs.workflow_revision }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          sleep "${{ vars.B5_NOREC_PROD_SLEEP || '10' }}"
          python3 - <<'PY'
          import hashlib, json, os, re, uuid
          uuid.UUID(os.environ["HELIO_RELEASE_ID"])
          assert re.fullmatch(r"[A-Za-z0-9._:-]{1,200}", os.environ["HELIO_EXECUTION_ID"])
          revision = os.environ["WORKFLOW_REVISION"] or os.environ["GITHUB_SHA"]
          assert revision == os.environ["GITHUB_SHA"], "workflow_revision must equal the executing commit"
          body = json.dumps({"application": "b5-norec", "version": os.environ["RELEASE_VERSION"],
                             "commit": os.environ["GITHUB_SHA"]}, sort_keys=True).encode()
          digest = "sha256:" + hashlib.sha256(body).hexdigest()
          payload = {"schema_version": 1, "helio_execution_id": os.environ["HELIO_EXECUTION_ID"],
                     "release_id": os.environ["HELIO_RELEASE_ID"], "artifact_digest": digest,
                     "artifact_uri": "urn:b5-norec@" + digest,
                     "rollback_workflow_id": ".github/workflows/b5-norec.yml", "workflow_revision": revision}
          json.dump({"ref": os.environ["GITHUB_SHA"], "auto_merge": False, "required_contexts": [],
                     "environment": os.environ["TARGET_ENVIRONMENT"], "task": "helio-forward-release",
                     "payload": payload}, open("deployment-evidence.json", "w"))
          print("deploying", digest)
          PY
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          deployment_id="$(curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$api/deployments" --data @deployment-evidence.json | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')"
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$api/deployments/$deployment_id/statuses" --data '{"state":"success","description":"Synthetic deployment evidence; no application deployed"}' > /dev/null
